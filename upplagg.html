<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Innebandy – skapa träningspass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Skapa träningspass: val av övningar till vänster, upplägget med valda övningar till höger. */
      :root {
        --blue: #0a3a6e;
        --navy: #0d4c8f;
        --black: #0b0e12;
        --white: #ffffff;
        --soft: rgba(255, 255, 255, 0.8);
        --paper: #ffffff;
        --ink: #0b0e12;
        --ink-soft: #5b6470;
        --rule: #dde2e8;
        --tint: #f1f4f8;
        --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.45;
      }
      .page {
        min-height: calc(100vh - var(--nav-h));
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .intro {
        background: var(--paper);
        color: var(--ink);
        padding-block: 32px 36px;
        padding-left: 48px;
        padding-right: max(48px, env(safe-area-inset-right, 0px));
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        line-height: 1.1;
        font-size: clamp(1.8rem, 3.2vw, 2.4rem);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1::before {
        content: "";
        display: block;
        width: 232px;
        max-width: 100%;
        height: 4px;
        background: radial-gradient(circle, var(--ink) 1.6px, transparent 2px)
          0 0 / 10px 4px repeat-x;
      }
      .meta {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .rows {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .build {
        background: linear-gradient(90deg, var(--blue) 50%, var(--black) 50%);
        color: var(--white);
        padding-block: 32px 40px;
        padding-left: max(32px, env(safe-area-inset-left, 0px));
        padding-right: 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .modes {
        display: inline-flex;
        align-self: flex-start;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
      }
      .modes button {
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--white);
        background: transparent;
        border: 0;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .modes button[aria-pressed="true"] {
        background: var(--white);
        color: var(--navy);
      }
      .mode-box {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .free-line {
        display: flex;
        gap: 6px;
        max-width: 420px;
      }
      .free-line .pick {
        flex: 1;
        min-width: 0;
      }
      .tid-in {
        width: 76px;
        flex: none;
        font: inherit;
        font-size: 0.875rem;
        padding: 8px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
      }
      .icon {
        flex: none;
        width: 32px;
        font: inherit;
        color: var(--white);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        cursor: pointer;
      }
      .free-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ghost {
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--white);
        background: transparent;
        border: 1px dashed rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .ghost:hover {
        border-color: var(--white);
      }
      .rows.free {
        counter-reset: n;
      }
      .rows.free .chosen b::before {
        counter-increment: n;
        content: counter(n) ". ";
      }
      .rows.free .chosen {
        grid-column: 1;
        margin: 0;
      }
      .rows.free .tid {
        align-self: start;
        padding-top: 8px;
      }
      .picks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .picks li {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 16px;
        padding-block: 12px;
        border-bottom: 1px solid var(--rule);
      }
      .row:first-child {
        border-top: 1px solid var(--rule);
      }
      .moment {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.875rem;
      }
      .tid {
        font-weight: 600;
        font-size: 0.875rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .text {
        grid-column: 1 / -1;
        margin: 0;
        color: var(--ink-soft);
      }
      .sub {
        grid-column: 1 / -1;
        list-style: none;
        margin: 6px 0 0;
        padding: 0 0 0 16px;
        border-left: 3px solid var(--rule);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sub .row {
        padding-block: 2px;
        border: 0;
      }
      .sub .moment {
        font-size: 0.8125rem;
      }
      .pick {
        width: 100%;
        max-width: 420px;
        font: inherit;
        font-size: 0.875rem;
        padding: 8px 10px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
      }
      .chosen {
        grid-column: 1 / -1;
        margin: 6px 0 0;
        padding: 8px 12px;
        border-left: 3px solid var(--navy);
        background: var(--tint);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .custom {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 420px;
        margin-top: 4px;
      }
      .custom input,
      .custom textarea {
        width: 100%;
        font: inherit;
        font-size: 0.875rem;
        padding: 8px 10px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
      }
      .custom textarea {
        min-height: 72px;
        resize: vertical;
      }
      .custom button {
        align-self: flex-start;
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--navy);
        background: var(--white);
        border: 0;
        border-radius: 999px;
        padding: 6px 16px;
        cursor: pointer;
      }
      .custom .note {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--soft);
      }
      .chosen small {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .chosen b {
        font-size: 0.9375rem;
      }
      .chosen p {
        margin: 0;
        font-size: 0.875rem;
        color: var(--ink-soft);
      }
      .pick:not([data-empty]) {
        border-color: var(--navy);
        font-weight: 600;
      }
      .clear {
        align-self: flex-start;
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--white);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .clear:hover {
        border-color: var(--white);
      }
      @media (max-width: 820px) {
        .page {
          grid-template-columns: minmax(0, 1fr);
        }
        .intro,
        .build {
          padding-left: max(20px, env(safe-area-inset-left, 0px));
          padding-right: max(20px, env(safe-area-inset-right, 0px));
        }
      }
    </style>
  </head>
  <body>
    <script src="nav.js"></script>
    <div class="page">
      <section class="build">
        <h2>Skapa träningspass</h2>
        <div class="modes" role="group" aria-label="Sätt att bygga passet">
          <button type="button" data-mode="mall">Utgå från upplägg</button>
          <button type="button" data-mode="fri">Fri lista</button>
        </div>
        <div class="mode-box" id="mallBox">
          <ol class="picks" id="picks"></ol>
          <button class="clear" id="clear" type="button">Rensa valda övningar</button>
        </div>
        <div class="mode-box" id="freeBox" hidden>
          <ol class="picks" id="free"></ol>
          <div class="free-tools">
            <button class="ghost" id="addFree" type="button">+ Lägg till övning</button>
            <button class="clear" id="clearFree" type="button">Rensa listan</button>
          </div>
        </div>
      </section>
      <section class="intro">
        <h1>Upplägg</h1>
        <p class="meta" id="meta"></p>
        <ol class="rows" id="rows"></ol>
      </section>
    </div>
    <script src="drills.js"></script>
    <script src="board.js"></script>
    <script src="plan.js"></script>
    <script>
      const plan = window.PLAN[window.NIVA];
      const meta = document.getElementById("meta");
      meta.textContent = plan.meta;
      meta.hidden = !plan.meta;

      // Allt sparas i webbläsaren, per nivå. Två sätt att bygga passet:
      // "mall" = ett val per moment i nivåns upplägg, "fri" = en egen lista i valfri ordning.
      const load = (key, empty) => {
        try {
          return JSON.parse(localStorage.getItem(key)) || empty;
        } catch {
          return empty;
        }
      };
      const store = (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      };
      const mall = { p: load(`pass-${window.NIVA}`, {}) };
      mall.save = () => store(`pass-${window.NIVA}`, mall.p);
      // Fri lista: rader i ordning med tid; vald övning per rad ligger i fri.p[rad-id].
      const fri = load(`fri-${window.NIVA}`, { rows: [], p: {}, next: 0 });
      fri.save = () => store(`fri-${window.NIVA}`, { rows: fri.rows, p: fri.p, next: fri.next });
      let mode = load("passlage", "mall");
      const DRILLS = window.DRILLS.filter((d) => d.levels.includes(window.NIVA));

      const OWN = "__egen";
      const MINE = "__min";
      function picker(r, id, st) {
        const sel = document.createElement("select");
        sel.className = "pick";
        sel.setAttribute("aria-label", `Övning för ${r.moment}`);
        sel.add(new Option(r.cat ? `Välj övning (${r.cat})` : "Välj övning", ""));
        // Sparad egen övning visas som ett vanligt val i listan.
        const mine = new Option("", MINE);
        sel.add(mine);
        sel.add(new Option("+ Egen övning…", OWN));
        // Momentets kategori först, sedan alla andra kategorier.
        const inCat = DRILLS.filter((d) => d.category === r.cat);
        const groups = [
          ["Tränarens val", inCat.filter((d) => !d.ovrigt)],
          ["Fler övningar", inCat.filter((d) => d.ovrigt)],
        ];
        for (const c of DrillBoard.CATEGORIES) {
          if (c === r.cat) continue;
          const list = DRILLS.filter((d) => d.category === c);
          groups.push([c, [...list.filter((d) => !d.ovrigt), ...list.filter((d) => d.ovrigt)]]);
        }
        for (const [label, list] of groups) {
          if (!list.length) continue;
          const g = document.createElement("optgroup");
          g.label = label;
          list.forEach((d) => g.appendChild(new Option(d.name, d.name)));
          sel.appendChild(g);
        }
        const own = typeof st.p[id] === "object";
        mine.hidden = !own;
        if (own) mine.text = st.p[id].name;
        sel.value = own ? MINE : DRILLS.some((d) => d.name === st.p[id]) ? st.p[id] : "";
        sel.toggleAttribute("data-empty", !sel.value);

        // Egen övning: läggs in i passet direkt och skickas samtidigt som förslag.
        // Den sparas i samma form som Föreslå övning, med tom skiss (img).
        const box = document.createElement("div");
        box.className = "custom";
        box.hidden = true;
        const name = document.createElement("input");
        name.type = "text";
        name.placeholder = "Namn på övningen";
        name.setAttribute("aria-label", `Namn på egen övning för ${r.moment}`);
        const text = document.createElement("textarea");
        text.placeholder = "Hur går övningen till?";
        text.setAttribute("aria-label", `Beskrivning av egen övning för ${r.moment}`);
        const btn = document.createElement("button");
        btn.type = "button";
        const note = document.createElement("p");
        note.className = "note";
        btn.addEventListener("click", () => {
          if (!name.value.trim() || !text.value.trim()) {
            note.textContent = "Skriv både namn och beskrivning.";
            return;
          }
          st.p[id] = {
            name: name.value.trim(),
            ...(r.cat && { category: r.cat }),
            levels: [window.NIVA],
            info: [["Anvisningar", text.value.trim()]],
            img: "",
          };
          st.save();
          mine.text = st.p[id].name;
          mine.hidden = false;
          sel.value = MINE;
          box.hidden = true;
          renderResult();
        });
        box.append(name, text, btn, note);

        sel.addEventListener("change", () => {
          if (sel.value === OWN) {
            // Öppna formuläret, ifyllt om det redan finns en egen övning här.
            const has = typeof st.p[id] === "object";
            if (!has) delete st.p[id];
            name.value = has ? st.p[id].name : "";
            text.value = has ? st.p[id].info[0][1] : "";
            btn.textContent = has ? "Spara" : "Lägg till";
            note.textContent = "";
            box.hidden = false;
            name.focus();
          } else if (sel.value !== MINE) {
            box.hidden = true;
            mine.hidden = true;
            if (sel.value) st.p[id] = sel.value;
            else delete st.p[id];
          } else box.hidden = true;
          st.save();
          sel.toggleAttribute("data-empty", !sel.value);
          renderResult();
        });
        return [sel, box];
      }

      // Vald övning visas i upplägget, under sitt moment.
      function chosen(id, st) {
        const own = typeof st.p[id] === "object";
        const d = own ? st.p[id] : DRILLS.find((x) => x.name === st.p[id]);
        if (!d) return null;
        const box = document.createElement("div");
        box.className = "chosen";
        const name = document.createElement("b");
        name.textContent = d.name;
        const p = document.createElement("p");
        p.textContent = own
          ? d.info[0][1]
          : [DrillBoard.players(d).replace(/^./, (c) => c.toUpperCase()) + ".", ...d.info.map(([, t]) => t).filter(Boolean)].join(" ");
        if (own) {
          const tag = document.createElement("small");
          tag.textContent = "Egen övning · skickad som förslag";
          box.append(tag);
        }
        box.append(name, p);
        return box;
      }

      function row(r, id) {
        const li = document.createElement("li");
        li.className = "row";
        const m = document.createElement("span");
        m.className = "moment";
        m.textContent = r.moment;
        const t = document.createElement("span");
        t.className = "tid";
        t.textContent = r.tid || "";
        li.append(m, t);
        if (r.text) {
          const p = document.createElement("p");
          p.className = "text";
          p.textContent = r.text;
          li.appendChild(p);
        }
        const c = chosen(id, mall);
        if (c) li.appendChild(c);
        if (r.sub) {
          const ul = document.createElement("ul");
          ul.className = "sub";
          r.sub.forEach((s, j) => ul.appendChild(row(s, `${id}.${j}`)));
          li.appendChild(ul);
        }
        return li;
      }
      const rows = document.getElementById("rows");
      const renderRows = () => {
        rows.innerHTML = "";
        plan.rows.forEach((r, i) => rows.appendChild(row(r, String(i))));
      };
      const renderFreeRows = () => {
        rows.innerHTML = "";
        fri.rows.forEach((r) => {
          const c = chosen(r.id, fri);
          if (!c) return;
          const li = document.createElement("li");
          li.className = "row";
          const t = document.createElement("span");
          t.className = "tid";
          t.textContent = r.tid;
          li.append(c, t);
          rows.appendChild(li);
        });
      };
      const renderResult = () => {
        rows.classList.toggle("free", mode === "fri");
        meta.hidden = mode === "fri" || !plan.meta;
        if (mode === "mall") renderRows();
        else renderFreeRows();
      };

      // Skapa träningspass: en lista per moment som har en kategori.
      const list = document.getElementById("picks");
      const render = () => {
        list.innerHTML = "";
        plan.rows.forEach((r, i) => {
          const items = [[r, String(i), r.moment]];
          (r.sub || []).forEach((s, j) => items.push([s, `${i}.${j}`, `${r.moment} · ${s.moment}`]));
          for (const [it, id, label] of items) {
            if (!it.cat) continue;
            const li = document.createElement("li");
            const m = document.createElement("span");
            m.className = "moment";
            m.textContent = label;
            li.append(m, ...picker(it, id, mall));
            list.appendChild(li);
          }
        });
      };
      document.getElementById("clear").addEventListener("click", () => {
        mall.p = {};
        mall.save();
        render();
        renderResult();
      });

      // Fri lista: en rad per övning, med tid och knappar för att flytta och ta bort.
      const freeList = document.getElementById("free");
      const iconBtn = (label, glyph, onClick) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "icon";
        b.textContent = glyph;
        b.title = label;
        b.setAttribute("aria-label", label);
        b.addEventListener("click", onClick);
        return b;
      };
      const renderFree = () => {
        freeList.innerHTML = "";
        fri.rows.forEach((r, i) => {
          const li = document.createElement("li");
          const tid = document.createElement("input");
          tid.className = "tid-in";
          tid.placeholder = "Tid";
          tid.value = r.tid;
          tid.setAttribute("aria-label", "Tid");
          tid.addEventListener("input", () => {
            r.tid = tid.value;
            fri.save();
            renderResult();
          });
          const [sel, own] = picker({ moment: `rad ${i + 1}`, cat: "" }, r.id, fri);
          const line = document.createElement("div");
          line.className = "free-line";
          line.append(
            sel,
            tid,
            iconBtn("Ta bort", "✕", () => {
              fri.rows.splice(i, 1);
              delete fri.p[r.id];
              fri.save();
              renderFree();
              renderResult();
            }),
          );
          li.append(line, own);
          freeList.appendChild(li);
        });
      };
      document.getElementById("addFree").addEventListener("click", () => {
        fri.rows.push({ id: "r" + fri.next++, tid: "" });
        fri.save();
        renderFree();
      });
      document.getElementById("clearFree").addEventListener("click", () => {
        fri.rows = [];
        fri.p = {};
        fri.save();
        renderFree();
        renderResult();
      });

      const showMode = () => {
        for (const b of document.querySelectorAll(".modes button"))
          b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
        document.getElementById("mallBox").hidden = mode !== "mall";
        document.getElementById("freeBox").hidden = mode !== "fri";
        renderResult();
      };
      for (const b of document.querySelectorAll(".modes button"))
        b.addEventListener("click", () => {
          mode = b.dataset.mode;
          store("passlage", mode);
          showMode();
        });
      render();
      renderFree();
      showMode();
    </script>
  </body>
</html>
